TOTAL_EPOCH: 300
METHOD: event_stereo_object_detection_and_tracking
DATASET:
  TRAIN:
    NAME: tumvie
    PARAMS:
      split: train
      event_raw_height: 480
      event_raw_width: 640
      sampling_ratio: 1
      event_height: 418
      event_width: 578
      event_rectified_height: 418
      event_rectified_width: 578
      crop_height: 480
      crop_width: 672
      randomhorizontalflip: False
      randomcrop: False
      num_repeat: 1
      isLoadCOCOFormat: False
      max_num_keypoints: 4
      config_name: traffic_signs
      seqsToUse: [0, 1, 2]
      event_cfg:
        NAME: sbn
        PARAMS:
          num_of_event: 200000
          stack_method: MixedDensityEventStacking
          stack_size: 10
          use_preprocessed_image: False
  VALID:
    NAME: tumvie
    PARAMS:
      split: valid
      event_raw_height: 480
      event_raw_width: 640
      event_height: 418
      event_width: 578
      event_rectified_height: 418
      event_rectified_width: 578
      crop_height: 480
      crop_width: 672
      randomhorizontalflip: False
      randomcrop: False
      num_repeat: 1
      isLoadCOCOFormat: False
      max_num_keypoints: 4
      config_name: traffic_signs
      seqsToUse: [0, 1]
      event_cfg:
        NAME: sbn
        PARAMS:
          num_of_event: 200000
          stack_method: MixedDensityEventStacking
          stack_size: 10
          use_preprocessed_image: False
  TEST:
    NAME: tumvie
    PARAMS:
      split: test
      event_raw_height: 480
      event_raw_width: 640
      sampling_ratio: 1
      event_height: 418
      event_width: 578
      event_rectified_height: 418
      event_rectified_width: 578
      crop_height: 480
      crop_width: 672
      randomhorizontalflip: False
      randomcrop: False
      num_repeat: 1
      isLoadCOCOFormat: False
      event_cfg:
        NAME: sbn
        PARAMS:
          num_of_event: 200000
          stack_method: MixedDensityEventStacking
          stack_size: 10
          use_preprocessed_image: False
DATALOADER:
  TRAIN:
    NAME: get_multi_epochs_dataloader
    PARAMS:
      batch_size: 4
      shuffle: False
      drop_last: True
  VALID:
    NAME: get_multi_epochs_dataloader
    PARAMS:
      batch_size: 4
      shuffle: False
      drop_last: True
  TEST:
    NAME: get_sequence_dataloader
    PARAMS:
      batch_size: 1
      shuffle: False
      drop_last: False
MODEL:
  concentration_net_cfg:
    DICTKEY: concentration_net
    CLASSNAME: ConcentrationNet
    is_freeze: True
    PARAMS:
      in_channels: 10
      attention_method: soft
      base_channels: 32
  disp_head_cfg:
    DICTKEY: disp_head
    CLASSNAME: StereoMatchingNetwork
    is_freeze: True
    PARAMS:
      in_channels: 1
      max_disp: 168
      refine_channels: 1
      num_downsample: 2
      no_mdconv: False
      feature_similarity: "correlation"
      num_scales: 3
      num_fusions: 6
      deformable_groups: 2
      mdconv_dilation: 2
      no_intermediate_supervision: False
      num_stage_blocks: 1
      num_deform_blocks: 3
      isInputFeature: False
  objdet_head_cfg:
    DICTKEY: objdet_head
    CLASSNAME: YoloPose
    is_freeze: True
    PARAMS:
      min_bbox_size: 5
      # detection
      num_classes: 2
      max_num_keypoints: 4
      in_channels: 10
      oks_sigma: [0.26, 0.25, 0.25, 0.35]
      num_topk_candidates: 30
      bbox_expand_factor: 1.3  # Note: this is only x direction, y direction is fixed
      # prior generator strides
      strides: [8, 16, 32]
      norm_cfg:
        type: BN
        momentum: 0.03
        eps: 0.001
      act_cfg:
        type: ReLU
      # region proposal
      nms_pre: 100
      nms_iou_threshold: 0.5
      # inference param
      nms_iou_threshold_inference: 0.2
      confidence_threshold_inference: 0.92
  stereo_detection_head_cfg:
    DICTKEY: stereo_detection_head
    CLASSNAME: StereoDetectionHead
    is_freeze: False
    PARAMS:
      # detection
      num_classes: 2
      max_num_keypoints: 4
      in_channels: 10
      channels_roi_extraction: 256
      feat_channels: 256
      num_stacked_convs: 2
      bbox_expand_anchor_ticks: [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0]
      OKS_SIGMA: [0.26, 0.25, 0.25, 0.35]
      norm_cfg:
        type: BN
        momentum: 0.03
        eps: 0.001
      act_cfg:
        type: ReLU
      # right bbox regression
      right_roi_feat_size: 28
      r_iou_bkg: 0.3
      r_iou_threshold: 0.8
      rpn_min_iou_with_target: 0.5
      candidates_k: 49
      # inference:
      right_nms_iou_threshold_inference: 0.2
      right_confidence_threshold_inference: 0.95
      left_right_confidence_diff_inference: 1.0
      left_right_width_diff_threshold: 1.3
      invalid_distance_from_image_border: 0
  local_tracking_head_cfg:
    DICTKEY: local_tracking_head
    CLASSNAME: StereoDetectionHead
    is_freeze: False
    PARAMS:
      # detection
      num_classes: 2
      max_num_keypoints: 4
      in_channels: 10
      channels_roi_extraction: 256
      feat_channels: 256
      num_stacked_convs: 2
      bbox_move_anchor_ticks: [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0]
      OKS_SIGMA: [0.26, 0.25, 0.25, 0.35]
      norm_cfg:
        type: BN
        momentum: 0.03
        eps: 0.001
      act_cfg:
        type: ReLU
      # right bbox regression
      right_roi_feat_size: 28
      r_iou_bkg: 0.3
      r_iou_threshold: 0.8
      rpn_min_iou_with_target: 0.5
      candidates_k: 49
      # inference:
      right_nms_iou_threshold_inference: 0.2
      right_confidence_threshold_inference: 0.99
      left_right_confidence_diff_inference: 1.0
      left_right_width_diff_threshold: 1.5
LOSSES:
  concentration_net_cfg:
    skiplossconf: True
  disp_head_cfg:
    NAME: DisparityLoss
    ls_loss_weight: 1.0
    warp_loss_weight: 100.0
    use_warp_loss: False
  objdet_head_cfg:
    bbox_loss_weight: 7.5
    cls_loss_weight: 0.5
    dfl_loss_weight: 1.5
    pose_loss_weight: 12.0
    kobj_loss_weight: 1.0
  stereo_detection_head_cfg:
    rbbox_loss_weight: 1
    rkeypts_loss_weight: 1
    rscore_loss_weight: 1
    rkeypts_obj_loss_weight: 1
    rpn_losses_cls_weight: 1.0
    rpn_losses_bbox_weight: 1.0
  local_tracking_head_cfg:
    skiplossconf: True
OPTIMIZER:
  # one type of optimizer being enabled
  optimizer0:
    is_enable: True
    NAME: AdamW
    PARAMS:
      lr: 0.0005
      weight_decay: 0.01
  optimizer1:
    is_enable: False
    NETWORK_TYPE: DETR
    NAME: AdamW
    PARAMS:
      params: 
        - 
          params: '^(?=.*backbone)(?!.*norm|bn).*$'
          lr: 0.000001
        - 
          params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
          weight_decay: 0.
      lr: 0.0001
      betas: [0.9, 0.999]
      weight_decay: 0.0001
LEARNING_CONFIG:
  clip_max_norm: 0.1
  use_amp: False  # Automatic Mixed Precision
  amp:
    type: GradScaler
  use_ema: False # Exponential Moving Average
  ema:
    type: 
    params:
      decay: 0.9999
      warmups: 2000
SCHEDULER:
# one type of scheduler being enabled at a time
  scheduler0:
    is_enable: True
    NAME: CosineAnnealingWarmupRestarts
    PARAMS:
      cycle_mult: 1.0
      first_cycle_steps: 100
      gamma: 1.0
      lr_ratio: 0.0001
      warmup_steps: 0
  scheduler1:
    is_enable: False
    NAME: DETR_SCHEDULER
    PARAMS:
      lr_scheduler:
        type: MultiStepLR
        params:
          milestones: [1000]
          gamma: 0.1
      lr_warmup_scheduler:
        type: LinearWarmup
        params:
          warmup_duration: 2000
  scheduler2:
    is_enable: False
    NAME: MASKRCNN_SCHEDULER
    PARAMS:
      lr_warmup_scheduler:
        end: 1
        start_factor: 0.00002
      lr_scheduler:
        gamma: 0.1
        milestones: [16, 22]

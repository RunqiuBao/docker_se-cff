TOTAL_EPOCH: 100
METHOD: circle_blob_detection
DATASET:
  TRAIN:
    NAME: circle_blob
    PARAMS:
      split: train
      sampling_ratio: 1
      crop_height: 1440
      crop_width: 1600
      randomhorizontalflip: True
  VALID:
    NAME: circle_blob
    PARAMS:
      split: valid
      sampling_ratio: 1
      crop_height: 1440
      crop_width: 1600
      randomhorizontalflip: False
  TEST:
    NAME: circle_blob
    PARAMS:
      split: test
      sampling_ratio: 1
      crop_height: 1440
      crop_width: 1600
      randomhorizontalflip: False
DATALOADER:
  TRAIN:
    NAME: get_multi_epochs_dataloader
    PARAMS:
      batch_size: 1
      shuffle: False
      drop_last: False
  VALID:
    NAME: get_multi_epochs_dataloader
    PARAMS:
      batch_size: 1
      shuffle: False
      drop_last: False
  TEST:
    NAME: get_sequence_dataloader
    PARAMS:
      batch_size: 1
      shuffle: False
      drop_last: False
MODEL:
  rtdetr_cfg:
    DICTKEY: rtdetr
    CLASSNAME: RTDETR
    is_freeze: False
    PARAMS:
      inference:
        params:
          lconfidence_threshold: 0.80
      backbone:
        network_class: PResNet
        params:
          in_channels: 10
          depth: 101
          variant: d
          freeze_at: 0
          return_idx: [1, 2, 3]
          num_stages: 4
          freeze_norm: True
          pretrained: False
      encoder:
        network_class: HybridEncoder
        params:
          in_channels: [512, 1024, 2048]
          feat_strides: [8, 16, 32]
          # intra
          hidden_dim: 384
          dim_feedforward: 2048
          use_encoder_idx: [2]
          num_encoder_layers: 1
          nhead: 8
          dropout: 0.
          enc_act: 'gelu'
          # cross
          expansion: 1.0
          depth_mult: 1
          act: 'silu'
      decoder:
        network_class: RTDETRTransformerv2
        params:
          feat_channels: [384, 384, 384]
          feat_strides: [8, 16, 32]
          hidden_dim: 256
          num_levels: 3
          num_layers: 6
          num_queries: 10
          num_denoising: 100
          label_noise_ratio: 0.5
          box_noise_scale: 1.0 # 1.0 0.4
          eval_idx: -1
          # NEW
          num_points: [4, 4, 4] # [3,3,3] [2,2,2]
          cross_attn_method: default # default, discrete
          query_select_method: default # default, agnostic
LOSSES:
  rtdetr_cfg:
    weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2,}
    losses: ['vfl', 'bboxes', ]
    alpha: 0.75
    gamma: 2.0
    matcher_cfg:
      params:
        type: HungarianMatcher
        weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
        alpha: 0.25
        gamma: 2.0
OPTIMIZER:
  # one type of optimizer being enabled
  optimizer0:
    is_enable: False
    NAME: Adam
    PARAMS:
      lr: 0.0005
      weight_decay: 0.0001
  optimizer1:
    is_enable: True
    NETWORK_TYPE: DETR
    NAME: AdamW
    PARAMS:
      params: 
        - 
          params: '^(?=.*backbone)(?!.*norm|bn).*$'
          lr: 0.000001
        - 
          params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
          weight_decay: 0.
      lr: 0.0001
      betas: [0.9, 0.999]
      weight_decay: 0.0001
LEARNING_CONFIG:
  clip_max_norm: 0.1
  use_amp: True  # Automatic Mixed Precision
  amp:
    type: GradScaler
  use_ema: True # Exponential Moving Average
  ema:
    type: 
    params:
      decay: 0.9999
      warmups: 2000
SCHEDULER:
# one type of scheduler being enabled at a time
  scheduler0:
    is_enable: False
    NAME: CosineAnnealingWarmupRestarts
    PARAMS:
      cycle_mult: 1.0
      first_cycle_steps: 100
      gamma: 1.0
      lr_ratio: 0.0001
      warmup_steps: 3
  scheduler1:
    is_enable: True
    NAME: DETR_SCHEDULER
    PARAMS:
      lr_scheduler:
        type: MultiStepLR
        params:
          milestones: [1000]
          gamma: 0.1
      lr_warmup_scheduler:
        type: LinearWarmup
        params:
          warmup_duration: 2000
